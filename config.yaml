  labs:
    enabled: true
    lookbackDays: 7
    companies:
      anthropic: 1.0
      openai: 1.0
      google: 1.0
      deepseek: 1.0
      xai: 1.0
      zhipu: 0.9
      kimi: 0.9
      qwen: 0.9
      meta: 0.8
      mistral: 0.8
      minimax: 0.8
    hidePatchReleases: true
    extraFeeds: []            # - { company: nvidia, name: NVIDIA Technical Blog, url: 'https://…/feed' }

# Transparent heat score:  norm = min(1, curve(raw)/curve(cap)) ;  points = norm × weight / Σweight × 100
boards:
  repos:
    size: 10
    runnersUp: 10
    signals:
      - { key: stars_today, weight: 40, cap: 1500, curve: log }
      - { key: momentum,    weight: 15, cap: 30,   curve: sqrt }     # stars today as % of total stars
      - { key: hn_echo,     weight: 15, cap: 500,  curve: log }      # points of HN stories linking to the repo
      - { key: paper_echo,  weight: 10, cap: 100,  curve: log }      # upvotes of the paper this repo implements
      - { key: novelty,     weight: 10, cap: 1,    curve: linear }   # 1 on first appearance, decays while it stays
      - { key: relevance,   weight: 10, cap: 1,    curve: linear }   # how squarely on-topic it is
  papers:
    size: 10
    runnersUp: 10
    signals:
      - { key: hf_upvotes,   weight: 35, cap: 150,  curve: log }
      - { key: hf_comments,  weight: 5,  cap: 30,   curve: log }
      - { key: code,         weight: 15, cap: 2000, curve: log }     # stars of the released code (1 if code exists)
      - { key: hn_echo,      weight: 15, cap: 300,  curve: log }
      - { key: repo_echo,    weight: 10, cap: 500,  curve: log }     # stars gained today by its repo
      - { key: recency,      weight: 10, cap: 1,    curve: linear }  # 1 today → 0 after a week
      - { key: source_prior, weight: 10, cap: 1,    curve: linear }  # curated list > journal > raw listing
  news:
    size: 10
    runnersUp: 10
    signals:
      - { key: points,    weight: 40, cap: 800, curve: log }
      - { key: comments,  weight: 15, cap: 400, curve: log }
      - { key: velocity,  weight: 20, cap: 60,  curve: sqrt }        # points per hour since posting
      - { key: echo,      weight: 15, cap: 2,   curve: linear }      # how many other boards it points into
      - { key: relevance, weight: 10, cap: 1,   curve: linear }
  social:
    size: 10
    runnersUp: 10
    signals:
      - { key: lift,       weight: 30, cap: 5,    curve: sqrt }      # vs. the author's / community's usual (via says which)
      - { key: reach,      weight: 20, cap: 5000, curve: log }       # X: likes + 2·reposts + 3·quotes + replies · Reddit: score
      - { key: discussion, weight: 10, cap: 500,  curve: log }       # replies / comments
      - { key: velocity,   weight: 10, cap: 500,  curve: sqrt }      # engagement per hour since posting (age ≥ 0.5 h)
      - { key: authority,  weight: 15, cap: 1.5,  curve: linear }    # watch-list weight (lab account, person, subreddit)
      - { key: echo,       weight: 10, cap: 2,    curve: linear }    # other boards it links into / is linked from
      - { key: relevance,  weight: 5,  cap: 1,    curve: linear }
    caps: { perAuthor: 2, perCommunity: 3, perPlatform: 7 }
  labs:
    size: 10
    runnersUp: 10
    signals:
      - { key: kind,      weight: 25, cap: 1,   curve: linear }      # model 1 · product .7 · research .6 · engineering .5 · company .35
      - { key: release,   weight: 10, cap: 0.7, curve: linear }      # +.5 model release, +.2 flagship
      - { key: freshness, weight: 30, cap: 1,   curve: linear }      # 0.5^(age hours / 24)
      - { key: echo,      weight: 20, cap: 1.5, curve: linear }      # HN + Reddit + X attention on links to the post
      - { key: company,   weight: 10, cap: 1.5, curve: linear }      # sources.labs.companies weight
      - { key: surface,   weight: 5,  cap: 0.2, curve: linear }      # blog .2 · changelog .1 · GitHub/HF 0
    caps: { perCompany: 3 }

# Optional. With no key the site still works; items simply show their original text and no brief.
# Set RESONANCE_LLM_API_KEY (and optionally _BASE_URL / _MODEL) as repository secrets.
enrich:
  enabled: true
  languages: [en, zh]
  baseUrl: https://api.deepseek.com      # any OpenAI-compatible endpoint
  model: deepseek-flash                  # check your provider's current model ids
  maxItemsPerRun: 120
  briefs: true                           # "today in 5 bullets" per edition and per week

pricing:
  enabled: true

# E-mail. Defaults only: the web app's Settings › Delivery writes the live values to the repository variable
# RESONANCE_MAIL, and the credentials to repository secrets (MAIL_TO, SMTP_USER, SMTP_PASS — or RESEND_API_KEY).
mail:
  enabled: false
  frequency: daily            # daily | weekly | both
  weekday: 2                  # Tuesday: the previous US-Pacific week has closed and settled (1–7)
  time: '08:30'
  timezone: Asia/Shanghai
  lang: zh
  provider: smtp              # smtp | resend
  preset: qq                  # qq | 163 | gmail | custom (then host/port/secure)
  attach: true                # attach the interactive report (.html)
  perBoard: 5
