# ─────────────────────────────────────────────────────────────────────────────
#  AI Resonance — the one file a fork needs to edit.
#  Change the topic (keywords / topics / categories) and you have a daily radar
#  for Rust, bioinformatics, robotics … The scoring formula below is published
#  verbatim to the site's "How scoring works" page.
# ─────────────────────────────────────────────────────────────────────────────

site:
  name: AI Resonance
  tagline:
    en: What AI builders, researchers and hackers are all looking at today.
    zh: 今天，AI 的开发者、研究者和极客们都在看什么。
  # Your copy: set repoUrl to your repository and siteUrl to '' (CI then derives https://<owner>.github.io/<repo>/).
  repoUrl: https://github.com/WZZNNE/AI-Resonance     # footer, Settings › Delivery, User-Agent contact URL
  siteUrl: https://wzznne.github.io/AI-Resonance/     # feeds, e-mail links, llms.txt; wins over the SITE_URL variable
  defaultLang: zh             # en | zh — first-visit language when the browser gives no hint
  theme:
    preset: titanium          # titanium | paper | terminal — see docs/CUSTOMIZE.md
    accent: ''                # any CSS colour; empty = preset default

# What "a day" is. Edition D = [D cutoff, D+1 cutoff) in this timezone — by default one full US-Pacific day.
# Timestamped items (HN, Reddit, X, lab posts, arXiv) are placed by their own time; GitHub star gains are measured
# between cutoffs. `settleHours` after the cutoff, engagement is re-read so late posts are judged fairly.
edition:
  timezone: America/Los_Angeles   # try America/New_York or Asia/Shanghai
  cutoff: '00:00'
  settleHours: 8

retention:
  days: 183                   # half a year of trend memory
  candidatesPerBoard: 60      # raw candidates kept per board per day (bounds repo size)

# What counts as "on topic". Used by the classifier for repos and news.
# Papers are on topic by construction (they come from the categories listed under sources).
topic:
  minRelevance: 0.35
  strongKeywords:             # any one of these in title/description ⇒ clearly on topic
    - llm
    - large language model
    - language model
    - generative ai
    - genai
    - machine learning
    - deep learning
    - neural network
    - transformer
    - diffusion model
    - reinforcement learning
    - fine-tuning
    - finetuning
    - rag
    - retrieval-augmented
    - ai agent
    - agentic
    - multi-agent
    - mcp
    - model context protocol
    - prompt engineering
    - text-to-image
    - text-to-video
    - text-to-speech
    - speech recognition
    - computer vision
    - embedding
    - vector database
    - inference engine
    - gpt
    - chatgpt
    - openai
    - anthropic
    - claude
    - gemini
    - deepseek
    - qwen
    - llama                   # also matches llama.cpp
    - mistral
    - kimi
    - glm
    - grok
    - codex
    - gemma
    - ollama
    - vllm
    - hugging face
    - huggingface
    - stable diffusion
    - copilot
    - agi
    - 大模型
    - 智能体
  weakKeywords:               # need two of these, or one plus a matching topic/domain
    - ai
    - agent
    - agents
    - model
    - models
    - inference
    - training
    - gpu
    - cuda
    - nvidia
    - benchmark
    - reasoning
    - chatbot
    - assistant
    - alignment
    - tokens
    - robotics
    - autonomous
  githubTopics:
    - ai
    - artificial-intelligence
    - machine-learning
    - deep-learning
    - llm
    - llms
    - large-language-models
    - generative-ai
    - agents
    - ai-agents
    - rag
    - mcp
    - nlp
    - computer-vision
    - diffusion
    - transformers
    - pytorch
    - reinforcement-learning
    - multimodal
    - text-to-speech
    - speech-recognition
    - vector-database
    - inference
    - fine-tuning
  domains:                    # a story from one of these hosts is on topic
    - openai.com
    - anthropic.com
    - deepmind.google
    - ai.google
    - ai.meta.com
    - huggingface.co
    - arxiv.org
    - mistral.ai
    - deepseek.com
    - x.ai
    - stability.ai
    - together.ai
    - simonwillison.net
    - lmsys.org
    - lmarena.ai
  exclude:                    # a match here vetoes the item
    - awesome-list-of-jobs

sources:
  githubTrending:
    enabled: true
    since: daily
    languages: ['', python, typescript, rust, go, jupyter-notebook, c++]   # '' = all languages
  githubSearch:
    enabled: true
    # One qualifier set per query: GitHub rejects OR between qualifiers (422). {{d-N}} = today minus N days.
    queries:
      - 'created:>{{d-7}} stars:>100'                     # fresh & hot; new repos often have no topics yet
      - 'created:>{{d-30}} pushed:>{{d-2}} stars:>300'
      - 'llm OR agent OR ai in:name,description,topics created:>{{d-30}} stars:>200'
      - 'topic:llm pushed:>{{d-7}} created:>{{d-365}}'
      - 'topic:ai-agents pushed:>{{d-7}} created:>{{d-365}}'
      - 'topic:mcp pushed:>{{d-7}} created:>{{d-365}}'
      - 'topic:rag pushed:>{{d-7}} created:>{{d-365}}'
      - 'topic:generative-ai pushed:>{{d-7}} created:>{{d-365}}'
    perQuery: 50
  hfPapers:
    enabled: true
    days: 4                   # look back this many daily lists (weekends are empty)
    prior: 1.0
  arxiv:
    enabled: true
    categories: [cs.AI, cs.CL, cs.LG, cs.CV]
    max: 200
    prior: 0.3
  journals:                   # any RSS/Atom feed of a journal or proceedings
    enabled: true
    prior: 0.8
    feeds:
      - { id: nature-mi, name: Nature Machine Intelligence, url: 'https://www.nature.com/natmachintell.rss' }
      - { id: jmlr, name: JMLR, url: 'https://www.jmlr.org/jmlr.xml' }
      - { id: jair, name: JAIR, url: 'https://www.jair.org/index.php/jair/gateway/plugin/WebFeedGatewayPlugin/atom' }
  hackerNews:
    enabled: true
    hours: 48                 # fetch window; late bloomers keep being tracked until their edition settles
    minPoints: 10

  # Reddit. The unauthenticated .json API answers 403; RSS works but carries no vote counts (items are then ranked by
  # their position in each community's Top-Today list) and allows ~1 request/minute. Set REDDIT_CLIENT_ID and
  # REDDIT_CLIENT_SECRET (an approved Reddit app) to get real scores and comment counts.
  reddit:
    enabled: true
    mode: auto                # auto | oauth | rss
    username: ''              # your Reddit name, used in the honest User-Agent Reddit asks for
    subreddits:               # same `group` = fetched in one combined feed; keep giants and small subs apart
      - { name: singularity,     group: 0, weight: 0.9, flairDeny: [Meme] }
      - { name: OpenAI,          group: 0, weight: 1.0 }
      - { name: ClaudeAI,        group: 0, weight: 0.9, flairDeny: [Humor] }
      - { name: artificial,      group: 0, weight: 0.9 }
      - { name: LocalLLaMA,      group: 1, weight: 1.3, flairDeny: [Funny, 'Question | Help'] }
      - { name: StableDiffusion, group: 1, weight: 0.8 }
      - { name: GeminiAI,        group: 1, weight: 0.9 }
      - { name: DeepSeek,        group: 1, weight: 1.0 }
      - { name: MachineLearning, group: 2, weight: 1.4 }
      - { name: LLMDevs,         group: 2, weight: 1.1 }
      - { name: mlscaling,       group: 2, weight: 1.0 }
      - { name: ClaudeCode,      group: 2, weight: 0.9, enabled: false }
    commentsPerPost: 8
    commentsForTop: 5
    minIntervalHours: 6

  # X. There is no free API in 2026: the official pay-per-use API costs about $20–30/month for this watch list
  # (set a spending limit in console.x.com); twitterapi.io / SocialData are cheaper but unofficial. `syndication` is free
  # and experimental: fresh only for business-verified organisation accounts. See docs/VERIFIED.md › v2 › X.
  # `auto`: with no secret, the free feed covers the official lab accounts only (personal accounts such as
  # @thsottiaux are skipped); add the repository secret X_BEARER_TOKEN and the next run uses the official API for the
  # whole list, within `monthlyUsdCap`. Or pin: xapi | twitterapi_io (TWITTERAPI_IO_KEY) | socialdata | syndication.
  x:
    enabled: true
    provider: auto
    linked: true              # free: X posts linked from HN / Reddit / lab pages are shown via oEmbed either way
    maxPostsPerRun: 300
    monthlyUsdCap: 20
    accounts:
